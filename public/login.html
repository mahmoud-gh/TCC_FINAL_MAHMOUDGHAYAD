<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CRM de Atendimento</title>
  <link rel="icon" type="image/png" href="/img/generated-image.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/theme.js"></script>
</head>
<body class="login-body">
  <form id="login-form" class="login-card">
    <img src="/img/generated-image.png" alt="Mahmoud Tcc" class="brand-logo" />
    <h1>CRM de Atendimento</h1>
    <p class="subtitle">WhatsApp</p>
    <label>
      Usuário
      <input type="text" id="username" autocomplete="username" required />
    </label>
    <label>
      Senha
      <input type="password" id="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Entrar</button>
    <p id="login-error" class="error hidden"></p>
  </form>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      if (res.ok) {
        window.location.href = '/index.html';
      } else {
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Falha no login.';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
