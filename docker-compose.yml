# Opcional: sobe o PostgreSQL e o CRM em contêineres.
#   docker compose up -d
# Depois crie o usuário: docker compose exec crm-app node scripts/create-user.js <usuario> <senha> "<Nome>" admin
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${PGPASSWORD:-troque-esta-senha}
      POSTGRES_DB: crm
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  crm-app:
    build: .
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: crm
      PGDATABASE: crm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
